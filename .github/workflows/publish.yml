name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from
        required: false
        default: main

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g @openai/codex
      - run: codex --version
      - run: npm ci
      - run: npm run check:version-sync
      - run: npm run check:changelog
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm publish
