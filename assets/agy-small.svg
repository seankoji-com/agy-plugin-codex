<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Antigravity (agy)">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1A1A30"/>
      <stop offset="100%" stop-color="#0A0A14"/>
    </radialGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B07BFF"/>
      <stop offset="50%" stop-color="#7B39FE"/>
      <stop offset="100%" stop-color="#28A9FF"/>
    </linearGradient>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.48 0 0 0 0 0.22 0 0 0 0 0.99 0 0 0 0.45 0"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="127" height="127" rx="27.5" fill="none" stroke="#7B39FE" stroke-opacity=".15"/>

  <!-- Glow layer -->
  <g filter="url(#gl)">
    <path d="M64 30 L36 88 L92 88 Z" fill="none" stroke="#7B39FE" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Sharp A monogram -->
  <path d="M64 30 L36 88 L92 88 Z" fill="none" stroke="url(#cg)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="64" y1="30" x2="64" y2="88" stroke="url(#cg)" stroke-width="4" stroke-linecap="round"/>
</svg>
